<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleep Well Sleep Tracker</title>
  <meta name="description" content="Sleep Well Sleep Tracker 记录睡眠时长、夜间噪音、疑似打鼾和睡眠趋势，内置白噪音混音与定时关闭。">
  <style>
    :root {
      --bg: #07121d;
      --panel: rgba(31, 39, 67, 0.9);
      --panel-strong: rgba(45, 55, 91, 0.72);
      --text: #f7fbff;
      --muted: #aab4c5;
      --accent: #58cdd4;
      --blue: #4c86ff;
      --line: rgba(255, 255, 255, 0.1);
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.34);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(88, 205, 212, 0.2), transparent 24%),
        radial-gradient(circle at 82% 4%, rgba(76, 134, 255, 0.18), transparent 22%),
        linear-gradient(180deg, #0b1b28 0%, #07121d 56%, #070b18 100%);
    }
    .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 80px; }
    .nav { display: flex; justify-content: space-between; margin-bottom: 28px; }
    .nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
    .nav a:hover { color: var(--accent); }
    .hero, .card {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }
    .hero { padding: 52px; border-radius: 34px; }
    .eyebrow {
      display: inline-flex;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(88, 205, 212, 0.14);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }
    h1 {
      margin: 22px 0 16px;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1;
    }
    p { margin: 0; color: var(--muted); font-size: 19px; line-height: 1.78; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
    .card { padding: 24px; border-radius: 24px; background: var(--panel-strong); }
    .card strong { display: block; margin-bottom: 8px; font-size: 18px; }
    .card span { color: var(--muted); line-height: 1.7; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 168px;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }
    .button.primary {
      background: linear-gradient(90deg, var(--accent), var(--blue));
      color: #03101d;
      border-color: transparent;
    }
    @media (max-width: 860px) {
      .hero { padding: 24px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="nav">
      <a href="../">项目索引</a>
      <a href="./support/">技术支持</a>
    </div>

    <section class="hero">
      <div class="eyebrow">iOS Sleep Tracker</div>
      <h1>Sleep Well Sleep Tracker</h1>
      <p>记录睡眠时长、夜间噪音与疑似打鼾，生成睡眠评分和趋势分析。内置白噪音混音与定时关闭，帮助你更轻松地了解并改善每晚睡眠。</p>

      <div class="cards">
        <div class="card">
          <strong>睡眠监测</strong>
          <span>记录夜间环境音、噪音和疑似打鼾事件，并生成睡眠报告。</span>
        </div>
        <div class="card">
          <strong>睡眠趋势</strong>
          <span>查看每日记录、周趋势、睡眠评分和夜间事件变化。</span>
        </div>
        <div class="card">
          <strong>白噪音混音</strong>
          <span>选择多个声源，自定义音量，支持循环播放和定时关闭。</span>
        </div>
      </div>

      <div class="links">
        <a class="button primary" href="./support/">技术支持</a>
        <a class="button" href="./privacy/">隐私政策</a>
      </div>
    </section>
  </main>
</body>
</html>
