<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WenJian - 本地优先 Markdown 笔记</title>
  <style>
    :root { --bg:#f7f5ef; --ink:#17201c; --muted:#63706a; --card:#fffdf8; --line:#e5ded0; --accent:#9b3f2f; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(180deg,#fbfaf5 0%,var(--bg) 100%); }
    main { max-width:960px; margin:0 auto; padding:64px 20px 80px; line-height:1.75; }
    .hero { padding:42px; border-radius:30px; background:var(--card); border:1px solid var(--line); box-shadow:0 18px 50px rgba(40,35,25,.08); }
    h1 { margin:0; font-size:42px; letter-spacing:-.04em; }
    h2 { margin:0 0 12px; font-size:22px; }
    p,li { font-size:16px; color:var(--muted); }
    .tag { color:var(--accent); font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:24px; }
    .card { padding:24px; border-radius:22px; background:var(--card); border:1px solid var(--line); }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    @media (max-width:760px){ .grid{grid-template-columns:1fr;} .hero{padding:28px;} h1{font-size:34px;} }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <p class="tag">WenJian for macOS</p>
      <h1>本地优先的 Markdown 笔记与写作工具</h1>
      <p>WenJian 适合记录灵感、整理文档、编写技术笔记和准备演示内容。内容优先保存在你选择的本地文件夹中，不要求登录账号。</p>
      <p><a href="./support.html">技术支持</a> · <a href="./privacy.html">隐私政策</a></p>
    </section>
    <section class="grid">
      <div class="card"><h2>本地优先</h2><p>选择自己的 Markdown 文件夹，内容由你掌控。</p></div>
      <div class="card"><h2>专注写作</h2><p>清爽三栏、格式工具栏、编辑与预览切换，降低 Markdown 记忆负担。</p></div>
      <div class="card"><h2>轻量高效</h2><p>macOS 原生体验，适合日常笔记、文档整理和知识沉淀。</p></div>
    </section>
  </main>
</body>
</html>
