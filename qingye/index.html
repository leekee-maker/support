<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轻页 - 本地 PDF 扫描与处理工具</title>
  <meta name="description" content="轻页是一款本地优先的 PDF 和文档处理工具，支持扫描、整理、转换、OCR、压缩、水印、加密和打印。">
  <style>
    :root {
      --bg: #071412;
      --panel: rgba(14, 30, 28, 0.9);
      --panel-strong: rgba(8, 21, 20, 0.96);
      --text: #f3fbf8;
      --muted: #93a9a2;
      --accent: #35d0b2;
      --line: rgba(255, 255, 255, 0.09);
      --shadow: 0 28px 72px rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 82% 8%, rgba(53, 208, 178, 0.18), transparent 22%),
        radial-gradient(circle at 8% 18%, rgba(70, 154, 255, 0.12), transparent 20%),
        linear-gradient(180deg, #081917 0%, var(--bg) 62%, #050c0b 100%);
    }

    .container {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 30px 0 78px;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .nav a:hover { color: var(--accent); }

    .hero,
    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 52px;
      border-radius: 34px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(53, 208, 178, 0.14);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 20px 0 16px;
      font-size: clamp(48px, 8vw, 82px);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .intro {
      max-width: 760px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .card {
      padding: 24px;
      border-radius: 24px;
      background: var(--panel-strong);
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }

    .card span {
      color: var(--muted);
      line-height: 1.72;
    }

    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 26px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 168px;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }

    .button.primary {
      background: linear-gradient(180deg, #43dfc0, #25bea2);
      color: #04231e;
      border-color: transparent;
    }

    .footnote {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .hero { padding: 24px; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="nav">
      <a href="../">项目索引</a>
      <a href="./support/">技术支持</a>
    </div>

    <section class="hero">
      <div class="eyebrow">Local PDF Tools</div>
      <h1>轻页</h1>
      <p class="intro">本地优先的 PDF 和文档处理工具，聚焦扫描、整理、转换、OCR、压缩、水印、加密和打印。无需登录即可处理常用文件，导出不添加 App 水印。</p>

      <div class="cards">
        <div class="card">
          <strong>扫描成 PDF</strong>
          <span>调用系统文档扫描能力，支持纸张边缘识别、自动裁边、透视校正和多页扫描。</span>
        </div>
        <div class="card">
          <strong>PDF 工具箱</strong>
          <span>合并、拆分、整理、压缩、文字水印、PDF 加密、PDF 转图片和打印。</span>
        </div>
        <div class="card">
          <strong>本地优先</strong>
          <span>基础文档处理默认在本机完成，不强制登录，不自动上传用户文件。</span>
        </div>
      </div>

      <div class="links">
        <a class="button primary" href="./support/">技术支持</a>
        <a class="button" href="./privacy/">隐私政策</a>
      </div>
    </section>

    <p class="footnote">© 2026 轻页</p>
  </main>
</body>
</html>
